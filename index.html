{id:'equipment',title:'先确认能安全存一周',caption:'开始前 · 不急着开火',items:['准备电饭煲、锅、刀板、食品温度计、厨房秤、14 个适合冷冻和复热的浅饭盒；容器以实际份量试装，不依赖固定容量。','确认家里冷冻空间和冰箱说明书的冷冻能力；不要把十四盒热饭紧贴堆入小冷冻室。能力不足就周六、周日分两批处理。','工作地点需要冰箱和复热设备，通勤用保冷袋与冰袋。没有这些条件，先不要照搬双份便当带一天。','虾仁提前放冷藏解冻。冻鸡胸也需要安全解冻，不能室温放一整夜。'],warning:'这是一周冷冻备餐，不是一周冷藏便当。冷藏 ≤4℃，冷冻 ≤−18℃。',refs:[0,5]},

{id:'ingredients',title:'蔬菜先切，生肉最后处理',caption:'只处理番茄、胡萝卜、豆腐、鸡胸',items:['番茄约 1 公斤清洗去蒂切块，不剥皮；胡萝卜约 1 公斤清洗去两端薄削皮，切约半厘米厚片。','北豆腐 1.5 公斤倒掉包装水，切约 2 厘米块。','鸡胸肉 1.5 公斤切约 2 厘米块，刀板与熟食分开；虾仁解冻沥水。','西兰花已是冷冻小朵，按包装说明处理。未轮到的生肉和海鲜及时放回冷藏。'],warning:'不要清洗生鸡肉造成飞溅；触碰生肉后洗手并清洁工具。',refs:[6]},
{id:'rice',title:'米饭分两锅，出锅就处理',caption:'每锅 500 克干米 → 7 份',items:['全周用 1 公斤干米，按电饭煲容量分批；例如每锅 500 克，按米和机器说明加水。','每锅饭熟后立即浅分装成 7 份，快速冷却；饭不能留在锅里等所有主菜做好。','可用干净容器外侧冷水浴帮助冷却，水不要进入饭里；尽量在煮好一小时内放入冷冻。','先单独冻饭也可以，主菜和配菜之后各自及时分装。不要为了凑一盒，拖延最早出锅食物的保存。'],warning:'冷却保存做错了，之后重新加热并不能保证安全。',refs:[2]},
{id:'chicken',title:'做 A 餐：黑椒鸡胸肉',caption:'只做一种口味 → 7 份',items:['整批用生鸡胸肉 1.5 公斤、油约 35 克、生抽约 45 毫升、黑胡椒约 3 克。','小锅分 3 批：每批鸡肉 500 克、约 1/3 的油和调料。先中火把鸡块翻炒，再加调料和少量水，盖盖焖熟。','不按表面颜色判断：较厚鸡块的中心至少 74℃。达到后停火，避免为追求焦边一直烧。','整批大致分 7 份，及时浅分装、快速冷却后冷冻。分批做时分别处理，不堆在台面等到全部结束。'],warning:'不把 1.5 公斤鸡肉一次塞进小炒锅。温度计比死守烹饪分钟数可靠。',refs:[1]},
{id:'shrimp',title:'做 B 餐：番茄虾仁豆腐',caption:'一锅带少量汁的菜 → 7 份',items:['整批用虾仁约 1 公斤、北豆腐 1.5 公斤、番茄约 1 公斤、油约 35 克、生抽约 30 毫升。','锅装不下就把所有原料按比例分批。先用油炒软番茄，再放豆腐和少量水煮开。','加入虾仁，轻推避免豆腐碎烂，煮至虾肉呈珍珠白、不再透明；不要只看是否卷成圈。收成少量菜汁。','大致分 7 份，每份都有虾和豆腐，再分菜汁。出锅的每批及时冷却保存。'],warning:'甲壳类或大豆过敏不适用。北豆腐冻过后质地会改变，首周先试一小份复热口感。',refs:[1]},
{id:'vegetables',title:'配菜做熟，和饭一起分份',caption:'西兰花 + 胡萝卜 → 14 份',items:['西兰花 2 公斤按包装说明分批蒸煮；胡萝卜处理后的全部分别做熟，不要求两种菜同一分钟出锅。','沥去多余水分，整批分配约 30 克油、约 3 克盐；先少放，不强行凑满。','配菜分 14 份；最终 A 主菜 7 份、B 主菜 7 份、米饭 14 份、配菜 14 份。','每餐 1 份主菜 + 1 份饭 + 1 份配菜，分盒存放也可以，不强制挤进同一盒。'],warning:'整菜采购重允许去蒂、去皮损耗，不需要为了几克补买。',refs:[]},
{id:'freeze',title:'贴标签，分批及时冷冻',caption:'记录真实制作日期',items:['标签写 A 或 B、制作日期、冷冻日期；分两天制作就分别写各自日期。','浅分装、快速降温，不在室温“彻底晾凉”几个小时。一般易腐食物两小时内入冷藏/冷冻，炎热环境（超过约 32℃）缩短至一小时；米饭按一小时更严格处理。','不要将多盒热食紧密堆叠，按冰箱容量分批；鸡蛋单独冷藏，不与便当一起冻。','每晚只将次日 A、B 各一份转入冷藏；完全解冻后 24 小时内吃，米饭冷藏不超过一天。只复热一次，便当中心达到 74℃。'],warning:'勾选表示你记录了步骤，不是系统自动测温或认证食物安全。',refs:[0,1,2,5]},
{id:'cleanup',title:'收好台面，工作日只取餐',caption:'最后一步 · 为明天省一点事',items:['洗净用过的刀板、锅和台面，把剩余干货密封收好。','明天要吃的饭按安全解冻流程处理；早上带两份便当、下午的牛奶和苹果。','晚餐没有公司冷藏条件就不要常温携带十多个小时；改成当场购买并记“换餐”。','每天洗当天的两个饭盒，不把十四个脏盒子留到下个周末。'],warning:'冷冻份量没有准备好时，首页只是计划，不表示冰箱里真的有饭。',refs:[5]}

function mealAt(s,w,slot){const p=getPlan(s,w);if(!integer(slot,0,13))throw Error('餐次无效');const index=p.order[slot],r=D.recipes[p.recipes[index]],side=D.weeks[p.cycle].sides[index%2],corn=index%2===1;

function needs(s,w){const sums={},uses={};for(const day of weekMenu(s,w))for(const m of [day.breakfast,day.lunch,day.snack,day.dinner])for(const [id,q]of Object.entries(m.planned===false?{}:m.ingredients)){sums[id]=(sums[id]||0)+q;(uses[id]||(uses[id]=new Set())).add(m.title);}return Object.entries(sums).map(([id,q])=>({...D.items[id],required:Math.round(q*10)/10,uses:[...uses[id]].sort((a,b)=>a.localeCompare(b,'zh'))}));}
function setPantry(s,w,id,qty,until){if(!D.items[id]||!finite(qty)||!validDate(until))throw Error('请填写非负数量和有效的可用截止日期');const p=getPlan(s,w);p.pantry[id]={qty,until};delete p.bought[id];}
function shopping(s,w,asOf=dateKey()){if(!validDate(asOf))throw Error('日期无效');const p=getPlan(s,w);return needs(s,w).map(x=>{const inv=p.pantry[x.id];const effectiveDate=asOf>addDays(w,-1)?asOf:addDays(w,-1);const available=inv&&inv.until>=effectiveDate?Math.min(x.required,inv.qty):0;const missing=Math.max(0,Math.round((x.required-available)*10)/10);const suggested=missing===0?0:Math.ceil((missing-1e-8)/x.packSize)*x.packSize;const fingerprint=[x.required,missing,suggested].join('|');return {...x,available,missing,suggested,expired:!!(inv&&inv.qty>0&&inv.until<effectiveDate),checked:p.bought[x.id]===fingerprint,fingerprint};}).sort((a,b)=>a.group.localeCompare(b.group,'zh')||a.title.localeCompare(b.title,'zh'));}

function consume(s,id,date,slot,now=Date.now(),confirmed=false){if(!confirmed)throw Error('先确认本餐保存、复热和过敏条件');if(!['lunch','dinner'].includes(slot)||!validDate(date)||date>dateKey(new Date(now)))throw Error('请选择今天或已发生的午晚餐');const b=findBatch(s,id),d=ensureDay(s,date);if(date<b.made)throw Error('不能在制作前吃掉这份便当');if(d.used[slot])throw Error('这一餐已经关联便当，不能重复扣减');if(d.meals[slot])throw Error('请先撤销原有手动餐食记录，再关联实际便当');const t=[...b.chilled].filter(x=>x.qty>0&&now-x.at<=24*HOUR&&now>=x.at&&dateKey(new Date(x.at))<=date).sort((a,b)=>a.at-b.at)[0];let source='frozen',at=null;if(t){t.qty--;source=t.id;at=t.at;}else if(b.frozen>0)b.frozen--;else throw Error('没有可记录食用的份数；冷藏超过24小时的记录须先核对，不自动视为安全');b.eaten++;d.used[slot]={batch:id,source,thawAt:at};d.meals[slot]=menuDay(s,date)[slot].planned!==false&&b.recipeId===menuDay(s,date)[slot].recipeId?'done':'changed';d.snapshots[slot]={title:b.meal.title,recipeId:b.recipeId,legacy:false,ingredients:clone(b.meal.ingredients),stapleTitle:b.meal.stapleTitle};}

const isMain=['lunch','dinner'].includes(slot);const instructions=isMain?['取1份完整便当：主菜、配饭、200克配菜（烹调前净重）；不是只取主菜。从实际已做好、妥善保存的便当中取本餐。不在室温解冻一整夜。','按容器和微波炉说明复热，中途翻动、充分静置，确认中心74℃。每份只复热一次。','未备好时用现做餐/外食，并如实记录“换餐”，不要假装冰箱已有饭。']:slot==='breakfast'?original.steps:['牛奶当天才开封，一次喝完；包装允许常温保存才可常温带。','水果保持完整，吃之前清洗；可分到上午、下午吃，不一次吃完也行。'];
sheet(m.title,`<span class="soft-tag">${selected} · ${isMain?original.stapleTitle:'当天组装'}</span>${allergenWarning(original.ingredients)}<h3>这一餐的起步份量</h3>${ingredients(original.ingredients)}<p class="sub">肉类按生可食净重；米燕麦按干重；整果和个别蔬菜按采购重，口径逐项标明。不是称熟饭的数字。</p><h3>怎么吃</h3>${list(instructions)}${isMain?button('看这道菜的批量做法','recipe',`data-id="${m.recipeId}" data-week="${C.weekKey(selected)}"`,'secondary wide'):''}${button('记录这一餐','meal-status-open',`data-slot="${slot}"`,'primary wide')}${sources()}`,'今天 · '+selected);}
function showMealStatus(slot){mealSlot=slot;const d=day(),used=d.used[slot];sheet('记录'+({breakfast:'早餐',lunch:'午餐',snack:'加餐',dinner:'晚餐'}[slot]),`<p class="sub">${selected} · ${esc(selectedMeal(slot).title)}</p>${used?notice('已经关联实际便当 '+esc(used.batch)+'，库存已扣减一次，不会重复扣减。'):''}<div class="status-grid">${[['done','按计划吃了'],['changed','换餐后吃了'],['partial','只吃了一部分'],['skipped','这餐没吃']].map(([k,v])=>button(k==='done'&&selectedMeal(slot).recipeId==='external'?'吃了（自行安排）':v,'meal-status',`data-status="${k}" ${used||selected>today()?'disabled':''}`,d.meals[slot]===k?'selected':'')).join('')}</div>${['lunch','dinner'].includes(slot)&&!used?button('用实际便当记录这餐','choose-stock','','secondary wide'):''}<p class="sub">普通打卡不扣饭盒库存；只有“用实际便当记录”会关联并扣减一次。</p>${d.meals[slot]&&!used?button('撤销手动记录','meal-clear','','text-button'):''}`,'打卡与看做法分开');}
function showMenu(w){menuWeek=w;const plan=C.getPlan(state,w),locked=C.isLocked(state,w);sheet('本周菜单',`<p class="sub">供餐 ${range(w)}</p><div class="cycle-tabs">${D.weeks.map((x,i)=>button('第'+(i+1)+'套','change-cycle',`data-index="${i}" ${locked?'disabled':''}`,i===plan.cycle?'active':'')).join('')}</div><h3 class="theme-title">${D.weeks[plan.cycle].title}</h3><p class="sub">${planned(w).length}道主菜，共${total(w)}餐。 ${locked?'已采购/记录：仅可调整未记录餐序。':'采购前可更换，清单与用量同时更新。'}</p>

<details open><summary>七天怎么吃</summary><div class="week-schedule">${C.weekMenu(state,w).map((d,i)=>`<details class="day-menu"><summary><b>周${['一','二','三','四','五','六','日'][i]}</b><span>${d.lunch.planned===false?'午餐 · 自行安排':d.lunch.title}<br><small>晚餐 · ${d.dinner.planned===false?'自行安排':d.dinner.title}</small></span></summary><div class="schedule-detail">早餐：${d.breakfast.title}<br>加餐：${d.snack.title}<br>午餐：${d.lunch.planned===false?'自行安排，不计采购':d.lunch.stapleTitle+' + 配菜'}<br>晚餐：${d.dinner.planned===false?'自行安排，不计采购':d.dinner.stapleTitle+' + 配菜'}</div></details>`).join('')}</div></details>${locked?button('撤销采购锁定并重新编辑','unlock','','text-button'):button('确认并锁定这周菜单','lock','','secondary wide')}

function showRecipe(id,w){const r=D.recipes[id],count=C.plannedCounts(state,w).find(c=>c.id===id)?.count??0;sheet(r.title,`<span class="soft-tag">${r.method} · ${count}份主菜的总用量</span>${allergenWarning(r.ingredients)}${ingredients(r.ingredients,count)}<h3>做法</h3>${list(r.steps)}<details><summary>单锅用水与分份</summary><p>炒焖每2份先加30–50毫升水；炖煮每2份先加100毫升。仅为起始量，水少且未熟时每次补30毫升，避免烧干；不是靠固定水量或时间判断熟透。清蒸水放蒸锅，按锅具要求加，不倒进鱼盘。</p><p>整批做熟后把主菜按${count}份均分；各盒配米饭和200克配菜（烹调前净重），才算${count}份完整便当。</p></details><p class="sub">估计亲手操作${r.active}，等待和批次数取决于锅具与装量；不是经实做验证的总时长。主食与配菜见对应餐卡。</p>${button('回到本周菜单','week-menu',`data-week="${w}"`,'secondary wide')}${sources()}`,'好买 · 复用原料 · 分批做');}
function showGrocery(id){const x=C.shopping(state,supply,today()).find(x=>x.id===id),inv=p().pantry[id];if(!x)throw Error('这项不在本周采购里');const checkDate=inv?.until||C.addDays(supply,6);sheet(x.title,`<div class="spec-box">${esc(x.spec)}</div><div class="quantity-grid"><div><small>本周需要</small><b>${qty(x.required,id)}</b></div><div><small>还缺</small><b>${qty(x.missing,id)}</b></div></div><p class="basis">重量口径：${esc(x.basis)}</p><p>包装参考：${x.suggested?`${qty(x.suggested,id)}${x.packSize>1?'（'+fmt(x.suggested/x.packSize)+'包/盒参考）':''}`:'不用补买'}。</p><p class="sub">${esc(x.packNote)}${x.packSize>1?' 估计用后余量'+qty(Math.max(0,x.suggested-x.missing),id)+'，不是已存在的库存。':''}</p>${x.expired?notice('之前填的可用截止日期已过；没有抵扣库存，请重新核对。',true):''}

function showAddBatch(index=0){currentBatch=null;sheet('记录实做份数便当',`<p class="sub">供餐周 ${range(supply)}。制作日期另记；填的是主菜、饭、配菜均已装好的完整份数。</p><label class="field">是哪一道菜<select id="batch-recipe">${planned().map(c=>`<option value="${c.index}" ${c.index===index?'selected':''}>${String.fromCharCode(65+c.index)} · ${D.recipes[c.id].title}（计划${c.count}份）</option>`).join('')}</select></label><div class="form-grid"><label>实际做成几份<input id="batch-count" type="number" min="1" max="50" step="1" placeholder="按实际填写" inputmode="numeric"></label><label>真实制作日期<input id="batch-made" type="date" value="${today()}" max="${today()}"></label></div><label class="checkbox-label"><input id="batch-confirm" type="checkbox"><span>我已核对适用条件；这些便当已经做熟、及时浅分装冷却，并实际放入冷冻。不是将来准备做的数量。</span></label>${notice('不把所有热饭堆进小冰箱。米饭尽快冷却，目标1小时内冷冻；其他易腐熟食及时处理。步骤勾选和份数记录是两回事。',true)}${button('保存实际冷冻份数','save-batch','','primary wide')}${sources()}`,'真实记录 · 默认没有库存');}
function showBatch(id){currentBatch=id;const b=C.findBatch(state,id),q=b.chilled.reduce((a,t)=>a+t.qty,0);sheet(b.meal.title,`<p class="sub">${b.id} · 制作 ${b.made}<br>供餐 ${range(b.week)}</p><div class="stock-totals"><div><b>${b.frozen}</b><small>冷冻</small></div><div><b>${q}</b><small>冷藏</small></div><div><b>${b.eaten}</b><small>已吃</small></div></div><p class="sub">总共做成${b.total}份，已丢弃${b.discarded}份。数量记录不是安全认证。</p>${button('移入冷藏（解冻）','thaw-form',b.frozen?'':'disabled','primary wide')}
${b.chilled.filter(t=>t.qty).map(t=>`<div class="cold-lot"><b>${t.qty}份冷藏 · ${dateTime(t.at)}移入</b>${Date.now()-t.at>86400000?'<p class="red">超过24小时提醒线，请核对。不会重置计时后继续当新鲜食品。</p>':'<p>按真实解冻/保存情况及时吃；这不是“保证安全”倒计时。</p>'}${button('丢弃这组中的份数','discard-form',`data-source="${t.id}"`,'text-button')}</div>`).join('')}

function showChooseStock(){const arr=state.batches.filter(b=>b.frozen+b.chilled.reduce((a,t)=>a+t.qty,0)>0);sheet('用哪一份便当？',`<p class="sub">记录 ${selected} 的${mealSlot==='dinner'?'晚餐':'午餐'}。选择实际吃的那份，菜单不同则记录为换餐。</p>${arr.length?arr.map(b=>`<button class="batch-card" data-action="consume-form" data-id="${b.id}"><span class="grow"><h3>${esc(b.meal.title)}</h3><small>${b.id} · ${b.made}制作 · 剩${b.frozen+b.chilled.reduce((a,t)=>a+t.qty,0)}份</small></span>${icon('right')}</button>`).join(''):notice('没有实际库存记录。先记录真正做好的便当，或返回记为现做/外食。')}`,'选择实际饭盒');}

function showSafety(){sheet('使用前的适用条件',`${notice('这是成年人入门用的固定份量模板，不是个人营养处方。无热量识别、无自动食品安全认证。',true)}${list(['年龄、性别、活动量、通勤和健康情况尚不完整。存在疾病、用药、孕哺期、饮食障碍或运动禁忌时，不能直接套用模板。','菜单含乳、蛋、大豆、小麦、鱼或甲壳类等，需核对包装与个人过敏。菜谱替换不是自动的营养或过敏等价替代。','本工具的一周备餐依赖足够的冷冻能力、浅分装、快速冷却和可靠冷链；有公司晚餐时还需保冷运输与冰箱。','冷藏≤4℃、冷冻≤−18℃。一般熟食冷藏3–4天，长于此应冷冻。水煮全熟鸡蛋冷藏一周内用完，不冷冻。','米饭尽快冷却分份，目标煮好后1小时内冷冻；一般易腐熟食不要在室温放超过2小时（高温环境更短）。','冷藏解冻，食用时彻底复热，便当中心74℃。每份只复热一次；已加热、已吃剩的不要按未加热新便当重新计时。','本工具从“移入冷藏”24小时发出核对提示，比按完全解冻后24小时更保守；并非保证安全的期限。状态依赖手动真实记录。','每周2次力量起步，逐步增加活动；有疼痛、胸痛、晕厥或异常气促停止，必要时及时就医。'])}${sources([0,1,2,3,4,5,6])}`,'范围与依据');}
function showUsage(){sheet('首次使用指引',`<p class="sub">一个人先试6餐、两道菜各3份；用一周再调整。已有记录不用重设。</p><ol class="instructions">
<li><b>设置</b><br>核对过敏和适用条件；训练先保持每周两次，不急着加量。</li>
<li><b>选餐</b><br>采购 → 确认供餐周 → 本周菜单。勾选要备的午晚餐，其余自行安排，不是不吃。先选好再采购；已有实际记录的周不能改写。</li>
<li><b>采购</b><br>点食材看规格，填家里可用量和截止日期，按“还缺”购买，再标记备齐。用量会自动重算，不用手工扣。</li>
<li><b>备餐</b><br>按步骤做，先试装1盒。做成并妥善保存后，记录真实制作日期和实际盒数；步骤勾选不增加库存。</li>
<li><b>每天取餐</b><br>前晚查看次日安排，在“实际饭盒”里记录移入冷藏的份数。吃完后：今天 → 对应餐次的记录 → 用实际便当记录这餐，选批次确认，扣1份。外食记换餐；普通打卡不扣饭盒。</li>
<li><b>每周收尾</b><br>核对剩余饭盒，实际丢弃才记丢弃；设置 → 导出JSON备份。下周重新选餐、核对原料库存。</li>
</ol><p class="sub">第一周只看：能否吃完、做饭是否吃力、饭盒账是否对得上。</p><details><summary>记录保存与使用限制</summary><p>固定从同一主屏幕图标进入。记录只存在当前浏览器，不自动同步；清理数据、换设备或入口前先导出。导入会替换当前记录，先备份。</p><p>添加到主屏幕后再导入，关闭重开核对餐数、饭盒和历史。无痕模式不适合长期记录；不保证离线或锁屏提醒，计时器刷新后不保留。</p><p>采购和备餐在周末默认面向下周，仍须核对供餐日期。已有实际记录保留原菜名，不随之后菜单变化。</p><p>本页没有外部脚本或追踪，主动点来源才访问外部网站。手机真机、实际厨房条件和烹饪耗时需自己首次核对。</p></details>`,'随时查看 · 不改变已有记录');}
function exportData(){const text=JSON.stringify(state,null,2),blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='轻行V2-备份-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('备份文件已发起下载');}
function startTimer(n,label='组间休息'){timer={active:true,running:true,duration:n,left:n,end:Date.now()+n*1000,label};updateTimer();}
function updateTimer(){const left=C.remaining(timer),e=$('#timer-float');if(timer.running&&left===0){timer.running=false;timer.left=0;toast(timer.label+'时间到；按身体状态继续。');}e.hidden=!timer.active;if(!timer.active){$$('[data-inline-timer]').forEach(x=>{x.innerHTML='<span>组间休息</span>'+button('开始60秒','timer-start','data-seconds="60"','timer-button');});return;}const display=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;e.innerHTML=`<span>${esc(timer.label)} <b>${display}</b></span>${button(timer.running?'暂停':left?'继续':'重来','timer-pause','','timer-button')}${button('结束','timer-stop','','timer-button')}`;$$('[data-inline-timer]').forEach(x=>x.innerHTML=e.innerHTML);}
function copyText(text){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>toast('已复制')).catch(()=>copyFallback(text));}else copyFallback(text);}
function copyFallback(text){sheet('复制清单',`<p class="sub">当前环境不能直接写入剪贴板，请长按或全选复制。</p><textarea id="copy-text" rows="12" readonly>${esc(text)}</textarea>`);$('#copy-text').select();}
$('#sheet-close').addEventListener('click',closeSheet);$('#sheet').addEventListener('click',e=>{if(e.target===$('#sheet')){const r=$('#sheet').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeSheet();}});

else if(a==='grocery')showGrocery(id);
else if(a==='save-pantry'){const v=$('#pantry-qty').value;if(v==='')throw Error('没有可用库存请明确填0');C.setPantry(state,supply,id,Number(v),$('#pantry-until').value);save();closeSheet();render();toast('已按本次可用库存重算');}
else if(a==='bought'){const x=C.shopping(state,supply).find(x=>x.id===id);C.markBought(state,supply,id,!x.checked);save();render();}
else if(a==='copy-list'){copyText('轻行 V2｜供餐 '+range(supply)+'\n'+C.shopping(state,supply).map(x=>`${x.checked?'☑':'☐'} ${x.title}\n规格：${x.spec}\n需用 ${qty(x.required,x.id)}；已核对可用 ${qty(x.available,x.id)}；还缺 ${qty(x.missing,x.id)}\n口径：${x.basis}\n包装参考补购 ${qty(x.suggested,x.id)}`).join('\n\n'));}
else if(a==='steps-view'){prepView='steps';render();}
else if(a==='stock-view'){prepView='stock';closeSheet();render();window.scrollTo(0,0);}
else if(a==='stock-home'){supply=C.weekKey(selected);prepView='stock';navigate('prep');}
else if(a==='to-shop')navigate('shop');
else if(a==='prep-index'){sheet('本次备餐步骤',stepsForWeek().map((s,i)=>button(`${i+1}. ${s.title}`,'step',`data-index="${i}"`,'step-index-row')).join(''));}

else if(a==='body'){sheet('记录真实身体状态',`<p class="sub">${selected} · 没称重就留空，不用初始体重补记录。</p><div class="form-grid"><label>体重 / kg<input id="body-weight" type="number" step="0.1" value="${day().weight??''}"></label><label>腰围 / cm<input id="body-waist" type="number" step="0.1" value="${day().waist??''}"></label></div><label class="field">状态备注<textarea id="body-note" maxlength="300">${esc(day().note)}</textarea></label>${button('保存实际记录','save-body','','primary')}`);}
else if(a==='save-body'){blocked();const w=$('#body-weight').value===''?null:Number($('#body-weight').value),wa=$('#body-waist').value===''?null:Number($('#body-waist').value);if((w!==null&&(!Number.isFinite(w)||w<30||w>250))||(wa!==null&&(!Number.isFinite(wa)||wa<40||wa>200)))throw Error('请核对体重30–250kg、腰围40–200cm，未测留空');Object.assign(C.ensureDay(state,selected),{weight:w,waist:wa,note:$('#body-note').value.slice(0,300)});save();showSettings();}
else if(a==='history'){const ds=Object.keys(state.days).sort().reverse();sheet('真实记录与旧版归档',`${ds.length?ds.slice(0,60).map(d=>`<details><summary>${d} · ${state.days[d].weight??'—'} kg</summary><p>${esc(state.days[d].note)}</p>${Object.entries(state.days[d].meals).map(([k,v])=>`<p>${esc(state.days[d].snapshots[k]?.title||k)} · ${statusName(v,state.days[d].snapshots[k]?.recipeId==='external')}</p>`).join('')}${state.days[d].legacyThaw?'<p class="sub">旧版取餐提醒曾勾选，仅归档，不当实际冷藏库存。</p>':''}<p class="sub">训练${Object.keys(state.days[d].sets).length}组 · 步行${state.days[d].walk}分钟</p></details>`).join(''):notice('没有真实记录，不展示虚假的进度。')}<details><summary>V1采购与步骤归档（不当库存）</summary><pre>${esc(JSON.stringify(state.legacyWeeks,null,2))}</pre></details>`);}
else if(a==='export')exportData();
else if(a==='import')$('#import-file').click();
else if(a==='migrate-local'){const old=localStorage.getItem(OLDKEY);if(!old)throw Error('本浏览器没有找到V1记录，请导入旧JSON');const n=C.validateBackup(old);if(!confirm('迁移会替换当前V2记录，V1原始键保留。先导出已有V2记录更稳妥，继续？'))return;state=n;legacyFound=false;save();render();}
else if(a==='safety')showSafety();
else if(a==='usage')showUsage();
else if(a==='reset'){if(!confirm('清空当前V2本地记录？无法撤销，建议先导出。V1原始数据不会删除。'))return;state=C.newState(today());selected=today();supply=C.prepWeek(today());save();closeSheet();navigate('today');}
}catch(err){safeError(err);}});
document.addEventListener('input',e=>{if(e.target.id==='food-search'){const pos=e.target.selectionStart;search=e.target.value.trim();render();$('#food-search').focus();if(pos!==null)$('#food-search').setSelectionRange(pos,pos);}});
$('#import-file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>4000000)throw Error('备份超过4MB');const n=C.validateBackup(await f.text());if(!confirm('备份校验通过。将替换当前V2记录（建议先导出），继续？'))return;state=n;save();closeSheet();selected=today();supply=C.prepWeek(today());navigate('today');toast('已恢复记录；旧步骤不会冒充实际便当。');}catch(err){safeError(err);}finally{e.target.value='';}});
setInterval(updateTimer,500);document.addEventListener('visibilitychange',()=>{if(!document.hidden){const was=lastToday;lastToday=today();if(was!==lastToday&&selected===was){selected=lastToday;supply=C.prepWeek(lastToday);render();}updateTimer();}});
$('#settings-button').innerHTML=icon('settings');$('#sheet-close').innerHTML=icon('x');$$('[data-nav-icon]').forEach(e=>e.innerHTML=icon(e.dataset.navIcon));
window.Lightday={version:D.version,getState:()=>JSON.parse(JSON.stringify(state)),getTimer:()=>({...timer}),validateBackup:C.validateBackup};render();
})();
</script>
</body>
</html>
